agent:
  id: "__AGENT_ID__"
  heartbeat_interval_seconds: 60
  log_level: "info"

watched_folders:
  - path: "C:/Users/Public/Documents/Tender Uploads"
    label: "Tender documents"
    priority: 1

validation:
  max_file_size_mb: 100
  allowed_extensions:
    - ".pdf"
    - ".docx"
    - ".doc"
  rejected_folder: "C:/ProgramData/TenderAgent/rejected"
  stability_check_interval_ms: 500
  stability_check_count: 3

upload:
  request_timeout_ms: 60000
  max_attempts: 5
  initial_retry_delay_ms: 5000
  max_retry_delay_ms: 300000
  blocked_retry_delay_ms: 300000
  worker_poll_interval_ms: 1000

logging:
  dir: "C:/ProgramData/TenderAgent/logs"
  max_files: "14d"
  max_size: "20m"
