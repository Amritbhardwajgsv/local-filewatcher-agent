<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IREPS Tender Downloader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">IREPS Manager</p>
        <h1>Tender Downloads</h1>
      </div>
      <div class="actions">
        <span id="loginState" class="state">Checking login</span>
        <button id="loginButton" type="button">Login</button>
        <button id="openFolderButton" type="button">Open Uploads</button>
      </div>
    </header>

    <main class="shell">
      <section class="panel input-panel">
        <div class="panel-head">
          <h2>Process tenders</h2>
          <button id="processButton" type="button">Start</button>
        </div>
        <textarea
          id="tenderInput"
          spellcheck="false"
          placeholder="Enter tender numbers, one per line"
        ></textarea>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Today</h2>
          <button id="clearHistoryButton" type="button">Clear</button>
        </div>
        <div class="stats">
          <div>
            <span id="totalCount">0</span>
            <label>Total downloaded</label>
          </div>
          <div>
            <span id="todayCount">0</span>
            <label>Downloaded today</label>
          </div>
        </div>
        <div id="statusList" class="status-list"></div>
      </section>

      <section class="panel history-panel">
        <div class="panel-head">
          <h2>History</h2>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
